# Release of the published tools: a tag vX.Y.Z builds them for Linux and
# macOS and attaches the archives and checksums to the GitHub release.
version: 2

project_name: voip-tui

builds:
  - id: rtpengine-tui
    main: ./cmd/rtpengine-tui
    binary: rtpengine-tui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: opensips-tui
    main: ./cmd/opensips-tui
    binary: opensips-tui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}
  - id: homer-tui
    main: ./cmd/homer-tui
    binary: homer-tui
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Tag}}

archives:
  - id: rtpengine-tui
    ids: [rtpengine-tui]
    name_template: "rtpengine-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/rtpengine-tui.md
      - docs/rtpengine-tui.ru.md
  - id: opensips-tui
    ids: [opensips-tui]
    name_template: "opensips-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/opensips-tui.md
      - docs/opensips-tui.ru.md
  - id: homer-tui
    ids: [homer-tui]
    name_template: "homer-tui_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - docs/homer-tui.md
      - docs/homer-tui.ru.md

checksum:
  name_template: checksums.txt

# commits start with the part they change: "rtpengine-tui: …", "tui: …"
changelog:
  groups:
    - title: rtpengine-tui
      regexp: '^.*?rtpengine-tui:'
      order: 0
    - title: opensips-tui
      regexp: '^.*?opensips-tui:'
      order: 1
    - title: homer-tui
      regexp: '^.*?homer-tui:'
      order: 2
    - title: Shared framework
      regexp: '^.*?(tui|tui/theme|i18n):'
      order: 3
    - title: Other
      order: 9

release:
  github:
    owner: napadailo
    name: voip-tui
